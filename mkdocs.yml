site_dir: docs_site
site_name: City of Boston Curbs API
site_description: Documentation for the City of Boston Curbs API (CDS Curbs v1.1)
site_url: https://cds-curb-api.boston.gov
repo_url: https://github.com/OETBoston/smart-curb-api
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.integrate
    - navigation.sections   # top-level groups render as headers instead of collapsibles
    - navigation.expanded   # expand all subsections by default
    - navigation.indexes    # attach an index.md to its section, so the section title is clickable
    - navigation.tracking
  palette:
    - scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - Usage guide: usage.md
  - Reference:
      - API reference: reference/api.md
      - CDS Curbs spec: reference/cds.md
  # - Examples:
  #     - curl: examples/curl.md
  #     - Python: examples/python.md
  #     - JavaScript: examples/javascript.md

plugins:
  - search
  - macros
  - swagger-ui-tag

extra:
  base_url: https://cds-curb-api.boston.gov
  generator: false

copyright: Copyright &copy; 2026 City of Boston